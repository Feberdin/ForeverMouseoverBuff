# Purpose: validate only redistributable own-code files, then prepare local artifacts.
# Inputs: commit source. Outputs: job status; no upload to CurseForge or public release.
# Invariant: no game credentials, real players, private fixtures, deployment or secrets.
# Debug: reproduce commands below locally and inspect the first failed step.
name: Portable checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 libxml2-utils shellcheck python3-venv
          python3 -m venv .ci-tools
          .ci-tools/bin/python -m pip install ruff==0.16.1 PyYAML==6.0.3
      - name: Addon portable suites
        env:
          LUA_BIN: lua5.1
        run: sh scripts/check-portable.sh
      - name: Python contracts and local HTTP integration
        env:
          LUA_BIN: lua5.1
        run: |
          python3 -m unittest discover -s tests -p test_release_package.py -v
          .ci-tools/bin/python -m unittest discover -s tests -p test_issue_templates.py -v
          python3 -m unittest discover -s companion/tests -v
          PYTHONPATH=service python3 -m unittest discover -s service/tests -v
          python3 -m unittest discover -s tests -p test_ranking_end_to_end.py -v
          python3 -m unittest discover -s tests -p test_diagnostics_end_to_end.py -v
      - name: Browser upload contracts
        run: |
          node --test service/tests/test_upload_core.cjs service/tests/test_upload_ui.cjs
          node --check service/static/app.js
          node --check service/static/upload-core.js
          node --check service/static/upload.js
      - name: Static checks
        run: |
          .ci-tools/bin/ruff check scripts/prepare-release.py tests/test_release_package.py tests/test_diagnostics_end_to_end.py tests/test_issue_templates.py service companion
          .ci-tools/bin/ruff format --check scripts/prepare-release.py tests/test_release_package.py tests/test_diagnostics_end_to_end.py tests/test_issue_templates.py service companion
          shellcheck scripts/check-portable.sh
          sh -n scripts/check-portable.sh
          python3 -m json.tool service/openapi.json > /dev/null
          python3 -m json.tool curseforge/metadata.json > /dev/null
      - name: Prepare reviewed packages without publishing
        run: |
          mkdir -p dist
          python3 scripts/prepare-release.py --version 0.7.3 --output dist/ci-0.7.3
