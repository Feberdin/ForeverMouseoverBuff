<!-- Purpose: original FMB brand artwork. Input: none. Output: 1600x420 SVG.
No game assets or external resources. Editable vector source; inspect PNG after rendering. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title"><title id="title">Hover a friendly player, press and release your key, cast a blessing; greetings are optional</title><defs>
<linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163b3d"/><stop offset="1" stop-color="#081719"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff0b8"/><stop offset=".45" stop-color="#eac77c"/><stop offset="1" stop-color="#b7883c"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#81ceb1" stop-opacity=".19"/><stop offset="1" stop-color="#81ceb1" stop-opacity="0"/></radialGradient>
</defs><rect width="1600" height="420" rx="24" fill="#0d2427"/><text x="48" y="63" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#91c6b3">A BLESSING IN THREE STEPS</text><rect x="48" y="101" width="472" height="270" rx="18" fill="#153336" stroke="#43615a"/><text x="76" y="151" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#e7c87f">01</text><text x="76" y="219" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="0" fill="#f5e9c8">Hover</text><text x="76" y="273" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0" fill="#bad0c7">Choose a friendly player</text><text x="76" y="305" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0" fill="#bad0c7">in the world or a unit frame.</text><rect x="552" y="101" width="472" height="270" rx="18" fill="#153336" stroke="#43615a"/><text x="580" y="151" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#e7c87f">02</text><text x="580" y="219" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="0" fill="#f5e9c8">Press &amp; release</text><text x="580" y="273" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0" fill="#bad0c7">Use your assigned buff key.</text><text x="580" y="305" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0" fill="#bad0c7">Hovering alone never casts.</text><rect x="1056" y="101" width="472" height="270" rx="18" fill="#153336" stroke="#43615a"/><text x="1084" y="151" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#e7c87f">03</text><text x="1084" y="219" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="0" fill="#f5e9c8">Share a blessing</text><text x="1084" y="273" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0" fill="#bad0c7">Cast a learned Paladin blessing.</text><text x="1084" y="305" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0" fill="#bad0c7">Greetings stay optional.</text></svg>
